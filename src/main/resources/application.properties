# Server Configuration
server.port=${PORT:8080}

# PostgreSQL Database Configuration (Production)
spring.datasource.url=${DATABASE_URL}   # We'll set DATABASE_URL in Render env vars
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:20000}

# Mail Configuration (unchanged)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:teamroutemax@gmail.com}
spring.mail.password=${MAIL_PASSWORD:xxxx}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# Logging
logging.level.org.springframework.security=${LOG_LEVEL:INFO}
logging.level.com.example.authdemo=${LOG_LEVEL:INFO}
